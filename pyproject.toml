[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extinction-risk-rank"
version = "0.1.0"
description = "Rank mammal species by trait-based extinction risk relative to published IUCN categories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "joblib>=1.4",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests", "challenges"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "network: downloads the PHYLACINE trait table",
]
